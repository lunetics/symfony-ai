<text x="10" y="410" font-size="9.5" fill="#52514e">✓ = higher invocation total within its channel.  Hollow dots are runs without a single mate execution —</text>
<text x="10" y="423" font-size="9.5" fill="#52514e">e.g. sonnet-5’s one hollow dot under injected/current text is an explicit refusal of the imperative wording.</text>
