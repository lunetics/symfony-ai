<text x="10" y="390" font-size="11" font-weight="600" fill="#0b0b0b">invoked, total</text>
<text x="207" y="390" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">1/49</text>
<text x="296" y="390" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">32/50</text>
<text x="371" y="390" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">44/50 ✓</text>
